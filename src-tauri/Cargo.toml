[package]
name = "grid-local"
version = "0.1.0"
description = "Grid Local: the local history and intelligence layer for AI coding"
authors = ["Dscvry"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "grid_local_lib"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2.9.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
walkdir = "2.3"
rayon = "1.10"
memmap2 = "0.9"
simd-json = "0.14"
memchr = "2.7"
aho-corasick = "1.1"
lru = "0.16"
anyhow = "1.0"
base64 = "0.23"
urlencoding = "2.1"
tempfile = "3.24.0"
trash = "5.2"
regex = "1.11"
lazy_static = "1.5"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
zstd = "0.13"
notify = { version = "7.0", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
comrak = { version = "0.49.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
# Core testing utilities
tempfile = "3.24.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Property-based testing (QuickCheck-style)
proptest = "1.4"

# Parameterized tests & fixtures
rstest = "0.18"

# Snapshot testing
insta = { version = "1.34", features = ["json", "redactions"] }

# Mocking framework
mockall = "0.12"

# Test assertions with better error messages
pretty_assertions = "1.4"
assert_matches = "1.5"

# Fake data generation
fake = { version = "2.9", features = ["derive"] }

# Test utilities
test-case = "3.3"
once_cell = "1.19"
serial_test = "3.2"

# Async testing utilities
async-std = { version = "1.12", features = ["attributes"] }
futures = "0.3"

[[bench]]
name = "performance"
harness = false

# Profile for faster test compilation
[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies in dev mode (simd-json, rayon need optimization)
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1  # Faster test execution
debug = true

# `strip = true` and `opt-level = 3` (explicit, matches the default)
# cost nothing at compile time; `lto = "thin"` is a deliberate middle
# ground -- real size/perf benefit over no LTO, without
# `codegen-units = 1` + fat LTO's much larger compile-time cost, which
# would slow down every `cargo bench`/`cargo build --release`
# invocation, not just a real ship build.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Profile for release builds with debug symbols (for coverage)
[profile.coverage]
inherits = "test"
debug = true
opt-level = 0

# Lints configuration
[lints.rust]
# Changed from "forbid" to "deny" to allow selective #[allow(unsafe_code)] for mmap performance optimizations
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nursery lints are too unstable - enable selectively if needed
# Allow certain lints that are too strict for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
# These are valid patterns in this codebase
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
# Allow casting in numeric code (common in size/count calculations)
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Allow reasonable patterns
items_after_statements = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
field_reassign_with_default = "allow"
manual_clamp = "allow"
map_unwrap_or = "allow"
ptr_arg = "allow"
format_push_string = "allow"
duplicated_attributes = "allow"
return_self_not_must_use = "allow"
